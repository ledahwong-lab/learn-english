name: cancel stuck pages deployment
on:
  push:
    paths:
      - .github/workflows/cancel-stuck-pages.yml
permissions:
  contents: read
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/190d979ba72eb15b5fb4a8bd2e4986b4bcf85ada/cancel" || true
          gh api "repos/${{ github.repository }}/pages/deployments/190d979ba72eb15b5fb4a8bd2e4986b4bcf85ada"
