<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课题目录</title>
  <style>
    :root { --ink:#1a1916; --muted:#5c5852; --red:#b42318; --paper:#f7f4ee; --sheet:#fffcf7; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Source Serif 4", "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: 17px;
      line-height: 1.55;
    }
    main { max-width: 40rem; margin: 0 auto; padding: 1.4rem 1.1rem 3.5rem; }
    .sheet { background: var(--sheet); border: 1px solid var(--ink); padding: 1.3rem 1.2rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.4rem; text-align: center; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 1.1rem; font-size: 0.92rem; }
    .paper-link {
      display: block;
      border: 1px solid var(--ink);
      padding: 0.7rem 0.85rem;
      margin: 0.5rem 0;
      text-decoration: none;
      color: var(--ink);
    }
    .paper-link strong { display: block; }
    .paper-link span { color: var(--muted); font-size: 0.9rem; }
    .refs {
      margin-top: 1.4rem;
      padding-top: 0.9rem;
      border-top: 1px solid #c9c2b6;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .refs a { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <div class="sheet">
      <h1>课题目录</h1>
      <p class="sub">已发布练习　点进去做　交卷后当场出分</p>

      <a class="paper-link" href="lessons/0001-he-she-it-s.html">
        <strong>练习 0001　第三人称单数</strong>
        <span>改错 + 中译英　20 题　交卷后出分</span>
      </a>

      <p class="refs">
        对照表：<a href="reference/third-person-s.html">第三人称单数</a>
        · <a href="reference/practice-order.html">先练什么</a>
      </p>
    </div>
  </main>
</body>
</html>
